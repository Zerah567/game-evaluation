<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Intelligence</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Game Intelligence 首页">
          <span class="brand-mark"></span>
          <span>GAME INTELLIGENCE</span>
        </a>
        <div class="topbar-status"><span class="status-dot"></span> AI 评分系统</div>
      </header>

      <main class="workspace">
        <section class="intro">
          <p class="kicker">RESEARCH DESK / 01</p>
          <h1>看见一款游戏的<br /><em>真实势能。</em></h1>
          <p class="intro-copy">
            基于产品、玩法、市场和商业化四个维度，建立可追溯的游戏评估。
          </p>
          <div class="intro-stats" aria-label="评分体系概览">
            <div><strong>04</strong><span>核心维度</span></div>
            <div><strong>42</strong><span>评估指标</span></div>
            <div><strong>100</strong><span>总分上限</span></div>
          </div>
        </section>

        <section class="analysis-panel" aria-labelledby="analysis-title">
          <div class="panel-heading">
            <div>
              <p class="section-index">新建分析</p>
              <h2 id="analysis-title">游戏评估简报</h2>
            </div>
            <span class="panel-code">BRIEF / AI</span>
          </div>

          <form id="reviewForm" class="review-form">
            <label class="field field-primary">
              <span>游戏名称 <i>必填</i></span>
              <input
                id="gameNameInput"
                type="text"
                placeholder="例如：黑神话：悟空"
                autocomplete="off"
                maxlength="160"
              />
            </label>
            <div class="field-row">
              <label class="field">
                <span>开发商 <i>可选</i></span>
                <input
                  id="developerInput"
                  type="text"
                  placeholder="例如：游戏科学"
                  autocomplete="off"
                  maxlength="160"
                />
              </label>
              <label class="field">
                <span>游戏链接 <i>可选</i></span>
                <input
                  id="gameLinkInput"
                  type="url"
                  placeholder="官网、商店页或资料页链接"
                  autocomplete="url"
                  maxlength="2048"
                />
              </label>
            </div>
            <div class="form-footer">
              <p>补充信息将作为 AI 的参考上下文，不会自动访问链接。</p>
              <div class="form-actions">
                <button id="regenerateBtn" class="icon-button" type="button" title="重新生成当前评分" hidden>
                  <span aria-hidden="true">↻</span><span class="sr-only">重新生成当前评分</span>
                </button>
                <button id="generateBtn" class="primary-button" type="submit">生成评估</button>
              </div>
            </div>
          </form>
          <p id="statusText" class="status" aria-live="polite"></p>
        </section>

        <section id="resultSection" class="result-panel empty" aria-live="polite">
          <div class="empty-state">
            <span class="empty-number">00</span>
            <div>
              <p class="section-index">等待输入</p>
              <h2>开始一份新的<br />游戏评估简报。</h2>
            </div>
          </div>
        </section>

        <aside class="sidebar" aria-label="数据记录">
          <section class="side-section">
            <div class="side-heading">
              <div>
                <p class="section-index">评分档案</p>
                <h2>历史记录</h2>
              </div>
              <button id="refreshHistoryBtn" class="icon-button" type="button" title="刷新历史记录">
                <span aria-hidden="true">↻</span><span class="sr-only">刷新历史记录</span>
              </button>
            </div>
            <input id="historySearch" class="search-input" type="search" placeholder="搜索游戏名称" />
            <div id="historyList" class="history-list"></div>
            <button id="historyMoreBtn" class="more-button" type="button" hidden>加载更多</button>
          </section>

          <section class="side-section knowledge-section">
            <div class="side-heading">
              <div>
                <p class="section-index">长期记忆</p>
                <h2 id="knowledgeTitle">游戏知识库</h2>
              </div>
              <button id="refreshKnowledgeBtn" class="icon-button" type="button" title="刷新游戏知识库">
                <span aria-hidden="true">↻</span><span class="sr-only">刷新游戏知识库</span>
              </button>
            </div>
            <input id="knowledgeSearch" class="search-input" type="search" placeholder="搜索游戏或类型" />
            <div id="knowledgeList" class="history-list"></div>
            <button id="knowledgeMoreBtn" class="more-button" type="button" hidden>加载更多</button>
          </section>

          <button id="exportBtn" class="export-button" type="button">导出本地数据</button>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
