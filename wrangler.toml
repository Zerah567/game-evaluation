name = "game-intelligence"
main = "src/worker.js"
compatibility_date = "2026-07-29"

[assets]
directory = "./game rating/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "game-rating-db"
# Create the database with `npm run cf:db:create`, then replace this value.
# This valid placeholder allows local D1 development before the remote database exists.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
OPENAI_BASE_URL = "https://api.deepseek.com"
OPENAI_MODEL = "deepseek-v4-flash"
MAX_REVIEWS = "200"
